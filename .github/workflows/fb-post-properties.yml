name: 每日FB物件自動發文（早上8點 + 下午2點 + 下午4點）

on:
  schedule:
    - cron: '0 22 * * *'  # 目標 TW 08:00（UTC 22:00 前一天，提前2小時補延遲）
    - cron: '0 6 * * *'   # 目標 TW 14:00（UTC 06:00，目前幾乎無延遲，保持不變）
    - cron: '30 7 * * *'  # 目標 TW 16:00（UTC 07:30，提前30分鐘補延遲）
  workflow_dispatch:
    inputs:
      slot:
        description: '時段（morning / afternoon）'
        required: false
        default: 'morning'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 判斷時段（早 / 午 / 晚）
        id: slot
        run: |
          HOUR=$(date -u +%H)
          # 早: UTC 22:00（HOUR=22），午: UTC 06:00（HOUR=6），晚: UTC 07:30（HOUR=7）
          if [ "$HOUR" -ge 21 ] || [ "$HOUR" -lt 5 ]; then
            echo "offset=0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -lt 7 ]; then
            echo "offset=1" >> $GITHUB_OUTPUT
          else
            echo "offset=2" >> $GITHUB_OUTPUT
          fi

      - name: 發布今日物件到 Facebook
        run: python scripts/fb_post_properties.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          POST_OFFSET: ${{ steps.slot.outputs.offset }}
