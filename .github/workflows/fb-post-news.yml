name: 每日FB新聞文字發文（早上8:30）

on:
  schedule:
    - cron: '30 21 * * *'  # 目標台灣時間 08:30（UTC 21:30 前一天，提前3小時補延遲）
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests Pillow html2image

      - name: 安裝 Chrome + 中文字型（供 html2image 截圖用）
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable fonts-noto-cjk
          fc-cache -fv

      - name: 發布今日新聞文字貼文到 Facebook
        run: python scripts/fb_post_news.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
