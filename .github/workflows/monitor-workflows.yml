name: 監控每日 Workflows（自動補跑）

on:
  schedule:
    - cron: '0 1 * * *'    # TW 09:00 — 早場補跑窗口
    - cron: '0 2 * * *'    # TW 10:00 — 早場補跑窗口
    - cron: '30 2 * * *'   # TW 10:30 — 早場補跑窗口
    - cron: '0 7 * * *'    # TW 15:00 — 午場補跑窗口
    - cron: '0 8 * * *'    # TW 16:00 — 下午補跑窗口
    - cron: '0 9 * * *'    # TW 17:00 — 晚場補跑窗口
    - cron: '0 11 * * *'   # TW 19:00 — 全日最終補跑（確保今天沒漏）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: 補跑未執行的 Workflows
        run: |
          UTC_HOUR=$(date -u +%H)
          UTC_MIN=$(date -u +%M)
          echo "當前 UTC 時間：${UTC_HOUR}:${UTC_MIN}"

          # 台灣今日開始 = UTC 昨天 16:00
          TW_TODAY_START=$(date -u -d "$(date -u +%Y-%m-%d) -16 hours" --iso-8601=seconds)
          echo "台灣今日起始點（UTC）: $TW_TODAY_START"
          echo ""

          # 檢查單一 workflow 今天是否已成功執行，若未執行就補跑
          # 參數: $1=workflow檔名  $2=最少應執行次數（預設1）
          check_and_run() {
            local WF=$1
            local MIN_COUNT=${2:-1}

            SUCCESS=$(gh run list \
              --workflow="$WF" \
              --repo="$REPO" \
              --limit=20 \
              --json conclusion,createdAt \
              --jq "[.[] | select(.createdAt >= \"$TW_TODAY_START\" and .conclusion==\"success\")] | length")

            IN_PROGRESS=$(gh run list \
              --workflow="$WF" \
              --repo="$REPO" \
              --limit=5 \
              --json status,createdAt \
              --jq "[.[] | select(.createdAt >= \"$TW_TODAY_START\" and (.status==\"in_progress\" or .status==\"queued\"))] | length")

            echo "  📊 $WF → 今日成功:${SUCCESS} 進行中:${IN_PROGRESS}"

            if [ "$SUCCESS" -ge "$MIN_COUNT" ]; then
              echo "  ✅ 已達標（${SUCCESS}/${MIN_COUNT}），跳過"
            elif [ "$IN_PROGRESS" -gt 0 ]; then
              echo "  ⏳ 執行中，跳過"
            else
              echo "  ⚠️  補觸發 $WF..."
              if gh workflow run "$WF" --repo="$REPO"; then
                echo "  ✅ 補觸發成功"
              else
                echo "  ❌ 補觸發失敗"
              fi
            fi
          }

          # ── 早場（TW 09-11，UTC 01-03）──────────────────────────────
          if [ "$UTC_HOUR" -ge 1 ] && [ "$UTC_HOUR" -le 3 ]; then
            echo "=== 早場補跑（TW 09-11） ==="
            check_and_run "fb-post-properties.yml"
            check_and_run "fb-post-news.yml"
            check_and_run "sync-properties.yml"
            check_and_run "fb-interactive-post.yml"
            check_and_run "daily-blog-post.yml"
            # fb-post-news-video 09:00 同時跑，UTC 01:00 不補（避免重複）
            # 改由 UTC 02:00（TW 10:00）補跑
            if [ "$UTC_HOUR" -ge 2 ]; then
              check_and_run "fb-post-news-video.yml"
            fi

          # ── 午場（TW 15，UTC 07）────────────────────────────────────
          elif [ "$UTC_HOUR" -eq 7 ]; then
            echo "=== 午場補跑（TW 15） ==="
            # fb-post-properties 今天需跑3次（早/午/晚），此時段至少要有1次
            check_and_run "fb-post-properties.yml"

          # ── 下午場（TW 16，UTC 08）──────────────────────────────────
          elif [ "$UTC_HOUR" -eq 8 ]; then
            echo "=== 下午場補跑（TW 16） ==="
            check_and_run "fb-post-news-video.yml"

          # ── 晚場（TW 17，UTC 09）────────────────────────────────────
          elif [ "$UTC_HOUR" -eq 9 ]; then
            echo "=== 晚場補跑（TW 17） ==="
            check_and_run "fb-post-properties.yml"

          # ── 全日最終補跑（TW 19，UTC 11）────────────────────────────
          elif [ "$UTC_HOUR" -eq 11 ]; then
            echo "=== 全日最終補跑（TW 19）— 確保今天所有 workflow 都跑過 ==="
            check_and_run "fb-post-news-morning.yml"
            check_and_run "fb-post-properties.yml"
            check_and_run "fb-post-news.yml"
            check_and_run "sync-properties.yml"
            check_and_run "fb-post-news-video.yml"
            check_and_run "fb-interactive-post.yml"
            check_and_run "daily-blog-post.yml"

          else
            echo "⚠️  UTC ${UTC_HOUR}:${UTC_MIN} 不在任何補跑窗口，跳過"
          fi
