name: 每日自動產生房市專欄文章

on:
  schedule:
    - cron: '30 1 * * *'  # 目標 TW 09:30（UTC 23:30 前一天，提前2小時補延遲）
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests beautifulsoup4

      - name: 產生今日房市文章
        run: python scripts/generate_post.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 產生今日物件介紹文章
        run: python scripts/generate_property_posts.py

      - name: 檢查是否有新文章
        id: check
        run: |
          git diff --quiet content/posts/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 提交新文章
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git commit -m "feat: 自動產生每日文章（房市專欄 + 物件介紹）$(date '+%Y-%m-%d')"
          git push

      - name: FB 發布今日房市文章
        run: python scripts/fb_post_article.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
